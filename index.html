  ::selection{background:var(--cyan);color:#FFFFFF;}

  .frame{min-height:100vh;display:flex;flex-direction:column;}

  .header-frozen{position:sticky;top:0;z-index:40;background:#FFFFFF;box-shadow:0 2px 10px rgba(30,39,51,.06);}
  .header-accent{height:5px;background:linear-gradient(180deg,#E2685A 0%,#C94A3F 55%,#B23F36 100%);}

  /* Top bar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;border-bottom:1px solid rgba(255,255,255,.15);
    background:linear-gradient(180deg,var(--garnet) 0%,#701F36 100%);
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:0.5px;color:#FFFFFF;
  }
  .brand .mark span{color:#F2C6D2;}
  .brand .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,.72);}
  .clock{font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(255,255,255,.72);}

  .tabs{display:flex;gap:6px;padding:0 28px;border-bottom:1px solid var(--border);background:#FFFFFF;}
  .tab-btn{
    appearance:none;border:none;background:transparent;color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
    padding:14px 4px;margin-right:26px;cursor:pointer;border-bottom:2px solid transparent;
    transition:color .15s ease,border-color .15s ease;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--sapphire);border-bottom-color:var(--sapphire);}
  .tab-btn.tab-mail.active{color:var(--sapphire);border-bottom-color:var(--sapphire);}
  .tab-btn.tab-facebook.active{color:var(--skyblue);border-bottom-color:var(--skyblue);}
  .tab-btn.tab-indexation.active{color:var(--garnet);border-bottom-color:var(--garnet);}
  .tab-btn.tab-rpi.active{color:var(--garnet);border-bottom-color:var(--garnet);}
  .tab-btn.tab-vdc.active{color:var(--green);border-bottom-color:var(--green);}
  .tab-btn.tab-asp.active{color:var(--purple);border-bottom-color:var(--purple);}

  /* Filter bar */
  .filterbar{
    display:flex;align-items:center;flex-wrap:wrap;gap:10px;
    padding:12px 28px;border-bottom:1px solid var(--border);background:#F5F7FA;
  }
  .filterbar-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);margin-right:2px;}
  .filter-group{position:relative;}
  .filter-btn{
    appearance:none;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:500;
    color:var(--text-dim);background:var(--panel);border:1px solid var(--border);border-radius:5px;
    padding:7px 12px;display:flex;align-items:center;gap:5px;transition:border-color .15s ease,color .15s ease;
  }
  .filter-btn:hover{color:var(--sapphire);border-color:var(--sapphire);}
  .filter-btn.active{color:var(--sapphire);border-color:var(--sapphire);background:#EAF0FA;}
  .filter-btn .count{font-family:'IBM Plex Mono',monospace;color:var(--sapphire);font-size:11px;}
  .filter-group.open .filter-panel{display:block;}
  .filter-panel{
    display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:200px;max-width:260px;
    max-height:260px;overflow-y:auto;background:var(--panel);border:1px solid var(--border);
    border-radius:6px;padding:6px;box-shadow:0 10px 24px rgba(30,39,51,.12);
  }
  .filter-item{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);
    padding:6px 8px;border-radius:4px;cursor:pointer;line-height:1.3;
  }
  .filter-item:hover{background:var(--panel-2);}
  .filter-item input{accent-color:var(--sapphire);cursor:pointer;flex:none;}
  .filter-empty{color:var(--text-dim);font-size:12px;padding:8px;}
  .filter-reset{
    appearance:none;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:500;
    color:var(--text-dim);background:transparent;border:1px solid var(--border);border-radius:5px;
    padding:7px 12px;margin-left:auto;transition:color .15s ease,border-color .15s ease;
  }
  .filter-reset:hover{color:var(--red);border-color:var(--red);}
  .filter-reset.active{color:var(--red);border-color:var(--red);}

  .page{display:none;padding:26px 16px 60px;width:100%;}
  .page.active{display:block;}

  .page-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .page-head h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0;font-weight:600;}
  .page-head .src{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);word-break:break-all;max-width:520px;}

  .status-line{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);margin-bottom:18px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);flex:none;}
  .dot.ok{background:var(--green);box-shadow:0 0 6px var(--green);}
  .dot.err{background:var(--red);box-shadow:0 0 6px var(--red);}
  .dot.loading{background:var(--amber);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .error-box{
    border:1px solid #EFC3BC;background:#FBEBE9;color:#8A3226;

<script>
const SPREADSHEET_ID = "1TUkf1bfj7cAnRXQV2V4cIsaiuDlI0V4tBhfmNQzh9YY";

  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}`;

const CONFIG = {

  },
  RPI: {

    // onglet "RPI tickets" — publié séparément sur le web (lien fourni), d'où une URL différente des autres onglets
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ666bJapHYwTRLkpaJ5CmJJjROgL4KVE64r_QuZHFYSIUqJyMNuNgQwdP-t8gbiMNTYfIPuvX3dtgm/pub?gid=1342028545&single=true&output=csv"
  },
  ASP: {
    label: "ASP OI",
    // onglet "ASP OI" — publié séparément sur le web (même document que RPI/VDC, gid différent).
    // Colonnes réelles : Agent / ID Activité / reception S2 / Nom client / Contact / Montant / Paiement /
    // Zone / État d'appels / Statut d'appels / Commentaires / Date début / Date fin / DMT / DMPC
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ666bJapHYwTRLkpaJ5CmJJjROgL4KVE64r_QuZHFYSIUqJyMNuNgQwdP-t8gbiMNTYfIPuvX3dtgm/pub?gid=274842311&single=true&output=csv"
  },
  VDC: {
    label: "VDC",
    // onglet "VDC" — publié séparément sur le web (même document que RPI, gid différent)
    // Colonnes réelles : Agent / ID Activité / Boutique / Type / Zone / Statut / Motif Rejet /
    // Réception S2 / Début Traitement / Fin Traitement / DMT / Date enregistrement / DMPC
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ666bJapHYwTRLkpaJ5CmJJjROgL4KVE64r_QuZHFYSIUqJyMNuNgQwdP-t8gbiMNTYfIPuvX3dtgm/pub?gid=699607282&single=true&output=csv"
  }
};

const CHARTS = {}; // holds Chart.js instances per key so we can destroy/rebuild on reload
const DATA = {};      // raw computed rows per key (unfiltered)
const DATA_MODE = {}; // detected mode per key
const FILTERS = { mois: new Set(), semaines: new Set(), dates: new Set(), agents: new Set(), zonesComptes: new Set() };

// ---------- helpers ----------
function normColKey(k){
  return String(k).trim().toLowerCase().replace(/\s+/g,' ');
}
function pick(row, names){
  // construit une correspondance insensible à la casse/aux espaces entre les noms de colonnes
  // recherchés et les en-têtes réels du CSV (ex: "Agent" doit matcher même si on cherche "AGENT")
  const normalized = {};
  Object.keys(row).forEach(k=>{ normalized[normColKey(k)] = row[k]; });
  for(const n of names){
    const v = normalized[normColKey(n)];
    if(v !== undefined && v !== null && String(v).trim() !== '') return v;
  }
  return '';
}
function parseFRDate(str){
  if(!str) return null;
  str = String(str).trim();
  if(!str) return null;
  const parts = str.split(' ');
  const datePart = parts[0];
  const timePart = parts[1] || '00:00:00';
  const tm = timePart.split(':');
  const h = parseInt(tm[0]||'0',10), mi = parseInt(tm[1]||'0',10), s = parseInt(tm[2]||'0',10);
  let d, m, y;
  if(datePart.indexOf('-') !== -1){
    // format ISO : AAAA-MM-JJ (ex: colonnes Réception S2 / Début Traitement / Fin Traitement de l'onglet VDC)
    const ymd = datePart.split('-');
    if(ymd.length < 3) return null;
    y = parseInt(ymd[0],10); m = parseInt(ymd[1],10); d = parseInt(ymd[2],10);
  }else{
    // format FR : JJ/MM/AAAA (autres onglets)
    const dm = datePart.split('/');
    if(dm.length < 3) return null;
    d = parseInt(dm[0],10); m = parseInt(dm[1],10); y = parseInt(dm[2],10);
  }
  if(!y || !m || !d) return null;
  const dt = new Date(y, m-1, d, h||0, mi||0, s||0);
  return isNaN(dt.getTime()) ? null : dt;
}
function toNum(v){
  const n = parseFloat(String(v).replace(',','.'));
  return isNaN(n) ? 0 : n;
}
function fmtHours(h){
  if(h === null || h === undefined || isNaN(h)) return '—';
  const sign = h < 0 ? '-' : '';
  h = Math.abs(h);
  const totalSec = Math.round(h*3600);
  const hh = Math.floor(totalSec/3600);
  const mm = Math.floor((totalSec%3600)/60);
  const ss = totalSec%60;
  return `${sign}${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}
function fmtDateShort(dt){
  if(!dt) return '—';
  return dt.toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit'});
}
function dayKey(dt){
  return dt.toISOString().slice(0,10);
}
function avg(arr){
  const f = arr.filter(v=>v!==null && !isNaN(v));
  if(!f.length) return null;
  return f.reduce((a,b)=>a+b,0)/f.length;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- calendar helpers (used by the global filters) ----------
function monthKey(dt){
  return dt.toLocaleDateString('fr-FR', {month:'short', year:'numeric'});
}
function monthSortKey(dt){
  return dt.getFullYear()*100 + dt.getMonth();
}
function dateKey(dt){
  return dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function isoWeekParts(dt){
  const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const fdDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - fdDayNum + 3);
  const week = 1 + Math.round((d - firstThursday) / (7*86400000));
  return {year: d.getUTCFullYear(), week};
}
function weekKey(dt){
  const p = isoWeekParts(dt);
  return `S${String(p.week).padStart(2,'0')} ${p.year}`;
}
function weekSortKey(dt){
  const p = isoWeekParts(dt);
  return p.year*100 + p.week;
}
// builds a chronologically-sorted list of unique labels from a set of rows, based on the date returned by getDate(r)
function buildSortedLabels(rows, getDate, labelFn, sortKeyFn, ascending){
  const map = new Map();
  rows.forEach(r=>{
    const dt = getDate(r);
    if(!dt) return;
    const label = labelFn(dt);
    if(!map.has(label)) map.set(label, sortKeyFn(dt));
  });
  const arr = Array.from(map.entries());
  arr.sort((a,b)=> ascending ? a[1]-b[1] : b[1]-a[1]);
  return arr.map(e=>e[0]);
}

// ---------- mode detection ----------
// Two data shapes exist in this workbook:
//  - "aggregated": one row per (date, type) with REÇU / TRAITE OK / TRAITE NOK counts (e.g. Indexation)
//  - "ticket": one row per individual ticket, with a BACKLOG (Oui/Non) flag instead (e.g. Mail, Facebook)
function detectMode(raw){
  if(!raw || !raw.length) return 'aggregated';
  const keys = Object.keys(raw[0]).map(k=>k.trim().toUpperCase());
  const hasRecu = keys.some(k=>k==='REÇU' || k==='RECU');
  return hasRecu ? 'aggregated' : 'ticket';
}

// ---------- core per-row computation ----------
// NB : pour l'onglet RPI OI, le DMPC et la DMPC globale se basent sur "receptionS2"
// (colonne de réception spécifique au flux RPI) et non sur la réception standard.
// Colonnes réelles de l'onglet "RPI tickets" : Nom Client / reception S2 / Début Traitement /
// ID Activité / Contact / Montant / Zone / Paiement / Mode de Règlement / Etat d'appels /
// Statuts / Commentaires / Fin Traitement / DMT (ms) / DMPC / Agent
function computeRows(raw, mode, key){
  const isRPI = key === 'RPI' || key === 'ASP';
  const isVDC = key === 'VDC';
  return raw.map(row=>{
    const reception = parseFRDate(pick(row,['Date de réception','Date de reception','Date et Heure de réception']));
    const receptionS2 = parseFRDate(pick(row,['reception S2','Réception S2','Reception S2','RECEPTION S2','receptionS2','Date réception S2','Date de réception S2','Date de reception S2']));
    const debut     = parseFRDate(pick(row,['Date de traitement','Date début de traitement','Début Traitement','Debut Traitement','Date début','Date Début']));
    const fin       = parseFRDate(pick(row,['Fin de traitement','Date Fin de traitement','Fin Traitement','Date fin','Date Fin']));
    const types = pick(row,['TYPES','TYPE','CANAL']) || 'Non renseigné';
    const zone = pick(row,['Zone','ZONE']) || 'Non renseigné';
    const agent = pick(row,['AGENT','Agent']);
    const compte = pick(row,['COMPTE','COMPTES','Compte','Nom du compte','NOM DU COMPTE','PAGE','Page','COMPTE FACEBOOK','Compte Facebook','Boutique','BOUTIQUE']) || 'Non renseigné';
    // "Etat d'appels" = statut brut Abouti/Non abouti (colonne dédiée sur RPI OI / ASP OI) — utilisé pour le graphe "Etat d'appels"
    const etatAppel = String(pick(row,["Etat d'appels","État d'appels",'ETAT APPELS',"Etat d'appel","État d'appel",'ETAT APPEL'])).trim();
    // "Statuts" = statut détaillé (colonne dédiée sur RPI OI / ASP OI) — utilisé pour le graphe en barres "Repartition statuts"
    const statutDetail = String(pick(row,['Statuts','STATUT','Statut','STATUTS','ETAT','État','RESULTAT','Résultat','STATUS',"Statut d'appels","Statut d'appel","STATUT D'APPELS"])).trim();
    // "Motif Rejet" — colonne dédiée VDC, utilisée pour le tableau "Top 5 motifs de rejet".
    const motifRejet = String(pick(row,['Motif Rejet','MOTIF REJET','Motif de rejet','MOTIF DE REJET'])).trim();
    // "ID Activité" — identifiant du ticket, utilisé pour le tableau détaillé "ID Activité / Motif / Boutique" (VDC).
    const idActivite = String(pick(row,['ID Activité','ID ACTIVITE','Id Activité','IDACTIVITE','ID_ACTIVITE','ID Activite'])).trim();

    let recu, ok, nok;
    if(mode === 'ticket'){
      recu = 1;
      if(isVDC){
        // VDC : pas de colonne BACKLOG — le statut VALIDE / REJETE de la colonne "Statut" fait foi.
        const statutRaw = String(pick(row,['Statut','STATUT'])).trim().toUpperCase();
        ok = statutRaw.startsWith('VALID') ? 1 : 0;
        nok = ok ? 0 : 1;
      }else if(key === 'MAIL'){
        // Mail : "dans les délais" = ticket reçu le jour J et dont le début de traitement
        // a lieu ce même jour J (comparaison des dates calendaires, donc forcément < 24h).
        const sameDay = reception && debut && dayKey(reception) === dayKey(debut);
        ok = sameDay ? 1 : 0;
        nok = sameDay ? 0 : 1;
      }else{
        const backlogRaw = String(pick(row,['BACKLOG'])).trim().toLowerCase();
        const isBacklog = backlogRaw === 'oui' || backlogRaw === 'yes' || backlogRaw === '1';
        ok = isBacklog ? 0 : 1;
        nok = isBacklog ? 1 : 0;
      }
    }else{
      recu = toNum(pick(row,['REÇU','RECU','Reçu']));
      ok   = toNum(pick(row,['TRAITE OK','TRAITÉ OK']));
      nok  = toNum(pick(row,['TRAITE NOK','TRAITÉ NOK']));
    }

    // Classement Abouti / Non abouti — basé sur la colonne "Etat d'appels" si présente, sinon repli sur OK/NOK.
    const etatAppelLower = etatAppel.toLowerCase();
    let isAbouti;
    if(etatAppelLower){
      isAbouti = etatAppelLower.includes('abouti') && !etatAppelLower.includes('non abouti') && !etatAppelLower.includes('non-abouti');
    }else{
      isAbouti = ok > 0 && nok === 0;
    }

    const dmt = (fin && debut) ? (fin-debut)/3600000 : null;
    // DMT = Fin de traitement - Début de traitement (identique pour tous les onglets)
    // DMPC / DMPC globale : RPI OI et VDC se basent sur receptionS2, les autres onglets sur la réception standard.
    const dmpcRef = (isRPI || isVDC) ? receptionS2 : reception;
    const dmpc = (debut && dmpcRef) ? (debut-dmpcRef)/3600000 : null;
    const dmpcGlobale = (fin && dmpcRef) ? (fin-dmpcRef)/3600000 : null;
    // Utilisée uniquement pour l'affichage/tri génériques (tableaux, regroupement par jour) —
    // RPI OI n'a pas de colonne de réception standard, donc on retombe sur receptionS2.
    const receptionDisplay = reception || receptionS2;
    const zoneCompte = (zone && zone !== 'Non renseigné') ? zone : compte;
    return {reception, receptionS2, receptionDisplay, debut, fin, recu, ok, nok, types, zone, agent, compte, zoneCompte, etatAppel, statutDetail, motifRejet, idActivite, isAbouti, dmt, dmpc, dmpcGlobale};
  });
}

function aggregate(rows, mode, groupField, key){
  groupField = groupField || 'types';
  const totalRecu = rows.reduce((a,r)=>a+r.recu,0);
  const totalOk = rows.reduce((a,r)=>a+r.ok,0);
  const totalNok = rows.reduce((a,r)=>a+r.nok,0);
  // Backlog = délai de prise en charge du ticket (Début Traitement − date de réception de référence
  // — réception S2 pour RPI/ASP/VDC, réception standard sinon — soit le DMPC déjà calculé par ligne,
  // en heures) supérieur à 24h. Aligné sur le calcul VDC : on ne compare plus à "maintenant", qui
  // faussait le résultat sur des données historiques (tout ticket ancien ressortait à tort en backlog).
  // Exception Mail : le backlog est le strict complément du "Taux dans les délais" (réception et début
  // de traitement le même jour calendaire J), afin que les deux cartes totalisent toujours 100%.
  const backlog = key === 'MAIL' ? totalNok : rows.reduce((sum,r)=>{
    if(r.dmpc !== null && r.dmpc > 24){
      return sum + (r.recu || 0);
    }
    return sum;
  }, 0);
  const backlogTaux = totalRecu ? (backlog/totalRecu*100) : null;
  const taux = totalRecu ? (totalOk/totalRecu*100) : null;

  const avgDmt = avg(rows.map(r=>r.dmt));
  const avgDmpc = avg(rows.map(r=>r.dmpc));
  const avgDmpcGlobale = avg(rows.map(r=>r.dmpcGlobale));

  // group by day (reception date)
  const byDay = {};
  rows.forEach(r=>{
    if(!r.receptionDisplay) return;
    const k = dayKey(r.receptionDisplay);
    if(!byDay[k]) byDay[k] = {ok:0, nok:0, recu:0, dmt:[], dmpc:[], dmpcGlobale:[], date:r.receptionDisplay};
    byDay[k].ok += r.ok;
    byDay[k].nok += r.nok;
    byDay[k].recu += r.recu;
    if(r.dmt!==null) byDay[k].dmt.push(r.dmt);
    if(r.dmpc!==null) byDay[k].dmpc.push(r.dmpc);
    if(r.dmpcGlobale!==null) byDay[k].dmpcGlobale.push(r.dmpcGlobale);
  });
  const days = Object.keys(byDay).sort();

  // group by type (ou par compte, selon la configuration de la page — voir TYPE_CHART_CONFIG)
  const byType = {};
  rows.forEach(r=>{
    const k = r[groupField] || 'Non renseigné';
    if(!byType[k]) byType[k] = 0;
    byType[k] += r.recu || 1;
  });

  // État d'appels (Abouti / Non abouti) — utilisé par le graphe "Etat d'appels" (RPI OI)
  const etatAppels = {abouti:0, nonAbouti:0};
  rows.forEach(r=>{ if(r.isAbouti) etatAppels.abouti++; else etatAppels.nonAbouti++; });

  // Répartition par statut brut — utilisé par le graphe en barres "Repartition statuts"
  const statutCounts = {};
  // Répartition des statuts détaillés, regroupés par Etat d'appels (Abouti / Non abouti) — RPI OI
  // Chaque statut garde aussi son DMT moyen (dmtSum/dmtN, calculé sur les lignes où le DMT est renseigné).
  const statutByEtat = {abouti:{}, nonAbouti:{}};
  rows.forEach(r=>{
    const k = r.statutDetail || 'Non renseigné';
    if(!statutCounts[k]) statutCounts[k] = 0;
    statutCounts[k]++;
    const bucket = r.isAbouti ? statutByEtat.abouti : statutByEtat.nonAbouti;
    if(!bucket[k]) bucket[k] = {n:0, dmtSum:0, dmtN:0};
    bucket[k].n++;
    if(r.dmt !== null){ bucket[k].dmtSum += r.dmt; bucket[k].dmtN++; }
  });

  return {mode, totalRecu, totalOk, totalNok, backlog, backlogTaux, taux, avgDmt, avgDmpc, avgDmpcGlobale, byDay, days, byType, etatAppels, statutCounts, statutByEtat};
}

// ---------- global filters (mois / semaine / date / agent) ----------
// Mois, Semaines et Date se basent sur la date DÉBUT DE TRAITEMENT (r.debut) — pour Indexation
// ce champ correspond à la colonne "Date de traitement" du sheet.
function rowPassesFilters(r){
  if(FILTERS.mois.size && r.debut && !FILTERS.mois.has(monthKey(r.debut))) return false;
  if(FILTERS.semaines.size && r.debut && !FILTERS.semaines.has(weekKey(r.debut))) return false;
  if(FILTERS.dates.size && r.debut && !FILTERS.dates.has(dateKey(r.debut))) return false;
  if(FILTERS.agents.size && r.agent && !FILTERS.agents.has(r.agent)) return false;
  if(FILTERS.zonesComptes.size && r.zoneCompte && !FILTERS.zonesComptes.has(r.zoneCompte)) return false;
  return true;
}
function applyFilters(rows){
  return rows.filter(rowPassesFilters);
}
function activeFilterCount(){
  return FILTERS.mois.size + FILTERS.semaines.size + FILTERS.dates.size + FILTERS.agents.size + FILTERS.zonesComptes.size;
}

// ---------- recap tables (per page, grouped by canal / type / compte) ----------
function computeRecapGroups(rows, groupField){
  const groups = {};
  rows.forEach(r=>{
    const key = r[groupField] || 'Non renseigné';
    if(!groups[key]) groups[key] = {rows:[], recu:0, ok:0, nok:0, abouti:0, nonAbouti:0};
    groups[key].rows.push(r);
    groups[key].recu += r.recu;
    groups[key].ok += r.ok;
    groups[key].nok += r.nok;
    if(r.isAbouti) groups[key].abouti++; else groups[key].nonAbouti++;
  });
  return groups;
}
function renderRecapTable(rows, groupField, groupLabel, variant, tableId){
  if(!rows.length) return `<div class="empty-state">Aucune donnée pour le récapitulatif.</div>`;
  const groups = computeRecapGroups(rows, groupField);
  const keys = Object.keys(groups).sort();

  const totalRow = (label, g)=>{
    const n = g.rows.length;
    const avgDmt = fmtHours(avg(g.rows.map(r=>r.dmt)));
    const avgDmpc = fmtHours(avg(g.rows.map(r=>r.dmpc)));
    const avgDmpcG = fmtHours(avg(g.rows.map(r=>r.dmpcGlobale)));
    if(variant === 'mail'){
      return `<td>${label}</td><td>${n}</td><td>${avgDmt}</td><td>${avgDmpc}</td><td>${avgDmpcG}</td>`;
    }else if(variant === 'indexation'){
      return `<td>${label}</td><td>${g.recu}</td><td>${g.ok}</td><td>${g.nok}</td><td>${avgDmt}</td><td>${avgDmpc}</td><td>${avgDmpcG}</td>`;
    }else if(variant === 'rpi'){
      const taux = n ? (g.abouti/n*100) : 0;
      return `<td>${label}</td><td>${n}</td><td>${g.abouti}</td><td>${g.nonAbouti}</td><td>${taux.toFixed(1)}%</td><td>${avgDmt}</td>`;
    }else{
      return `<td>${label}</td><td>${n}</td><td>${avgDmt}</td><td>${avgDmpc}</td><td>${avgDmpcG}</td>`;
    }
  };

  let head;
  if(variant === 'mail') head = `<th>${groupLabel}</th><th>Nombre</th><th>DMT</th><th>DMPC</th><th>DMPC globale</th>`;
  else if(variant === 'indexation') head = `<th>${groupLabel}</th><th>Reçu</th><th>OK</th><th>NOK</th><th>DMT</th><th>DMPC</th><th>DMPC globale</th>`;
  else if(variant === 'rpi') head = `<th>${groupLabel}</th><th>Appels</th><th>Abouti</th><th>Non abouti</th><th>Taux aboutis</th><th>DMT</th>`;
  else head = `<th>${groupLabel}</th><th>Nombre de lignes</th><th>DMT</th><th>DMPC</th><th>DMPC globale</th>`;

  const bodyRows = keys.map(k=>`<tr>${totalRow(escapeHtml(k), groups[k])}</tr>`);
  const totalGroup = {rows, recu:rows.reduce((a,r)=>a+r.recu,0), ok:rows.reduce((a,r)=>a+r.ok,0), nok:rows.reduce((a,r)=>a+r.nok,0), abouti:rows.reduce((a,r)=>a+(r.isAbouti?1:0),0), nonAbouti:rows.reduce((a,r)=>a+(r.isAbouti?0:1),0)};
  bodyRows.push(`<tr style="font-weight:600;color:var(--text);">${totalRow('Total', totalGroup)}</tr>`);

  return `<table${tableId ? ` id="${tableId}"` : ''}><thead><tr>${head}</tr></thead><tbody>${bodyRows.join('')}</tbody></table>`;
}

// ---------- "Top 5 motifs de rejet" (VDC) ----------
// Normalise un motif pour le regroupement : espaces multiples réduits, point(s) final(aux) retiré(s),
// comparaison insensible à la casse — afin que "Justdom manquant", "Justdom manquant." ou
// "justdom manquant " (juste une erreur de frappe/espace/point) soient comptés comme un seul motif.
// Un motif avec un commentaire en plus ("Justdom manquant - voir agence") reste distinct.
function normalizeMotifKey(s){
  return s.replace(/\s+/g,' ').replace(/\.+$/,'').trim().toLowerCase();
}

function computeTopMotifsRejet(rows, topN){
  topN = topN || 5;
  const counts = {};        // clé normalisée -> nombre
  const displayLabel = {};  // clé normalisée -> libellé affiché (1ère occurrence rencontrée, nettoyée)
  let total = 0;
  rows.forEach(r=>{
    if(r.nok > 0 && r.motifRejet){
      const raw = r.motifRejet.trim();
      if(!raw) return;
      const key = normalizeMotifKey(raw);
      if(!key) return;
      counts[key] = (counts[key] || 0) + 1;
      if(!displayLabel[key]) displayLabel[key] = raw.replace(/\s+/g,' ').replace(/\.+$/,'').trim();
      total++;
    }
  });
  const entries = Object.entries(counts)
    .map(([key,n]) => [displayLabel[key], n])
    .sort((a,b)=>b[1]-a[1])
    .slice(0, topN);
  return {entries, total};
}

function renderTopMotifsRejetTable(rows, tableId, topN){
  const {entries, total} = computeTopMotifsRejet(rows, topN);
  if(!entries.length) return `<div class="empty-state">Aucun motif de rejet renseigné sur la période affichée.</div>`;
  const bodyRows = entries.map(([motif,n])=>{
    const taux = total ? (n/total*100) : 0;
    return `<tr><td>${escapeHtml(motif)}</td><td>${n.toLocaleString('fr-FR')}</td><td>${taux.toFixed(1)}%</td></tr>`;
  }).join('');
  return `
    <table${tableId ? ` id="${tableId}"` : ''}>
      <thead><tr><th>Motif de rejet</th><th>Nombre</th><th>Taux (sur les rejets)</th></tr></thead>
      <tbody>${bodyRows}<tr style="font-weight:600;color:var(--text);"><td>Total rejets pris en compte</td><td>${total.toLocaleString('fr-FR')}</td><td>100.0%</td></tr></tbody>
    </table>`;
}

// Top motifs de rejet, ventilés par boutique — une mini-table par boutique (triée par nb de rejets décroissant).
function computeMotifsRejetByBoutique(rows, topMotifs, topBoutiques){
  topMotifs = topMotifs || 5;
  const byBoutique = {};
  rows.forEach(r=>{
    const b = r.compte || 'Non renseigné';
    if(!byBoutique[b]) byBoutique[b] = {totalActivites:0, totalRejets:0, motifs:{}};
    byBoutique[b].totalActivites += r.recu;
    if(r.nok > 0){
      byBoutique[b].totalRejets += r.nok;
      const m = (r.motifRejet || '').trim();
      if(m) byBoutique[b].motifs[m] = (byBoutique[b].motifs[m] || 0) + 1;
    }
  });
  let result = Object.entries(byBoutique)
    .filter(([,d])=>d.totalRejets > 0)
    .map(([boutique,d])=>{
      const top = Object.entries(d.motifs).sort((a,b)=>b[1]-a[1]).slice(0, topMotifs);
      const tauxGlobal = d.totalActivites ? (d.totalRejets/d.totalActivites*100) : 0;
      return {boutique, totalActivites:d.totalActivites, totalRejets:d.totalRejets, tauxGlobal, top};
    })
    // classement par nombre de rejets puis par taux de rejet (les boutiques les plus impactées en premier)
    .sort((a,b)=> b.totalRejets - a.totalRejets || b.tauxGlobal - a.tauxGlobal);
  if(topBoutiques) result = result.slice(0, topBoutiques);
  return result;
}

function renderMotifsRejetByBoutiqueTables(rows, wrapId, topMotifs, topBoutiques){
  const data = computeMotifsRejetByBoutique(rows, topMotifs, topBoutiques);
  if(!data.length) return `<div class="empty-state">Aucun rejet avec motif renseigné sur la période affichée.</div>`;
  const tables = data.map(d=>{
    const bodyRows = d.top.map(([motif,n])=>{
      const taux = d.totalRejets ? (n/d.totalRejets*100) : 0;
      return `<tr><td>${escapeHtml(motif)}</td><td>${n.toLocaleString('fr-FR')}</td><td>${taux.toFixed(2)}%</td></tr>`;
    }).join('');
    return `
    <div style="border:1px solid var(--border);border-radius:6px;padding:10px;background:var(--panel);">
    <table style="margin-bottom:0;">
      <thead>
        <tr><th colspan="3" style="text-align:center;background:var(--bg-soft,#f4f4f8);">${escapeHtml(d.boutique)}</th></tr>
        <tr><th>Motif de rejet</th><th>Nb de Rejet</th><th>Taux</th></tr>
      </thead>
      <tbody>
        ${bodyRows}
        <tr style="font-weight:700;background:#fdf1c7;"><td>Total rejet</td><td>${d.totalRejets.toLocaleString('fr-FR')}</td><td>${d.tauxGlobal.toFixed(2)}%</td></tr>
      </tbody>
    </table>
    </div>`;
  }).join('');
  return `<div${wrapId ? ` id="${wrapId}"` : ''} class="boutiques-grid" style="display:grid;grid-template-columns:repeat(${Math.min(data.length,5)},1fr);gap:14px;align-items:start;">${tables}</div>`;
}

// ---------- quick "DMPC < 30 min" cards (Mail & Facebook only) ----------
const QUICK_DMPC_THRESHOLD_H = 0.5; // 30 minutes, in hours
const QUICK_DMPC_PAGES = {MAIL:true, FACEBOOK:true, INDEXATION:false, RPI:false, ASP:false, VDC:false};
const QUICK_DMPC_MAX_CARDS = 24;

function renderQuickDmpcCards(rows, totalTraitement){
  const fast = rows
    .filter(r=>r.dmpc!==null && r.dmpc < QUICK_DMPC_THRESHOLD_H && r.receptionDisplay)
    .sort((a,b)=>b.receptionDisplay-a.receptionDisplay);
  const total = totalTraitement || 0;
  const taux = total ? (fast.length/total*100) : null;
  if(!fast.length) return {count:0, total, taux, html:`<div class="empty-state">Aucun traitement avec une DMPC inférieure à 30 min sur la période affichée.</div>`};

  const shown = fast.slice(0, QUICK_DMPC_MAX_CARDS);
  const cardsHtml = shown.map(r=>`
    <div class="quick-card">
      <div class="quick-card-label">DMPC</div>
      <div class="quick-card-dmpc">${fmtHours(r.dmpc)}</div>
      <div class="quick-card-meta"><span class="quick-card-date">${fmtDateShort(r.receptionDisplay)} ${r.receptionDisplay.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span></div>
    </div>`).join('');
  const moreNote = fast.length > shown.length
    ? `<div class="quick-cards-more">+ ${fast.length - shown.length} autre(s) traitement(s) non affiché(s)</div>`
    : '';
  return {count: fast.length, total, taux, html: `<div class="quick-cards-grid">${cardsHtml}</div>${moreNote}`};
}

function waitForPapaLib(timeoutMs){
  timeoutMs = timeoutMs || 4000;
  return new Promise(resolve=>{
    const start = Date.now();
    (function check(){
      if(typeof Papa !== 'undefined') return resolve(true);
      if(Date.now() - start > timeoutMs) return resolve(false);
      setTimeout(check, 100);
    })();
  });
}

function waitForChartLib(timeoutMs){
  timeoutMs = timeoutMs || 4000;
  return new Promise(resolve=>{
    const start = Date.now();
    (function check(){
      if(typeof Chart !== 'undefined') return resolve(true);
      if(Date.now() - start > timeoutMs) return resolve(false);
      setTimeout(check, 100);
    })();
  });
}

function renderTable(rows, mode, tableId, key){
  if(key === 'RPI' || key === 'ASP'){
    const sorted = rows.filter(r=>r.receptionDisplay).sort((a,b)=>b.receptionDisplay-a.receptionDisplay).slice(0,12);
    if(!sorted.length) return `<div class="empty-state">Aucune ligne datée à afficher.</div>`;
    const rowsHtml = sorted.map(r=>{
      const pill = r.isAbouti ? '<span class="pill ok">Abouti</span>' : '<span class="pill nok">Non abouti</span>';
      return `<tr>
      <td>${fmtDateShort(r.receptionDisplay)}${r.receptionDisplay? ' '+r.receptionDisplay.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</td>
      <td>${r.zone}</td>
      <td>${r.agent||'—'}</td>
      <td>${fmtHours(r.dmt)}</td>
      <td>${escapeHtml(r.statutDetail||'—')}</td>
      <td>${pill}</td>
    </tr>`;
    }).join('');
    return `
    <table${tableId ? ` id="${tableId}"` : ''}>
      <thead><tr>
        <th>Réception</th><th>Zone</th><th>Agent</th><th>DMT</th><th>Statut</th><th>Etat d'appel</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  }
  const tLabels = ticketLabels(key);
  const okText = mode === 'ticket' ? tLabels.ok : 'OK';
  const nokText = mode === 'ticket' ? tLabels.nok : 'NOK';
  const sorted = rows.filter(r=>r.receptionDisplay).sort((a,b)=>b.receptionDisplay-a.receptionDisplay).slice(0,12);
  if(!sorted.length) return `<div class="empty-state">Aucune ligne datée à afficher.</div>`;
  const rowsHtml = sorted.map(r=>{
    let pill = '<span class="pill mixed">en cours</span>';
    if(r.ok>0 && r.nok===0) pill = `<span class="pill ok">${okText}</span>`;
    else if(r.nok>0 && r.ok===0) pill = `<span class="pill nok">${nokText}</span>`;
    else if(r.ok>0 && r.nok>0) pill = '<span class="pill mixed">mixte</span>';
    return `<tr>
      <td>${fmtDateShort(r.receptionDisplay)}${r.receptionDisplay? ' '+r.receptionDisplay.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</td>
      <td>${r.types}</td>
      <td>${r.agent||'—'}</td>
      <td>${fmtHours(r.dmt)}</td>
      <td>${fmtHours(r.dmpc)}</td>
      <td>${fmtHours(r.dmpcGlobale)}</td>
      <td>${pill}</td>
    </tr>`;
  }).join('');
  return `
    <table${tableId ? ` id="${tableId}"` : ''}>
      <thead><tr>
        <th>Réception</th><th>Type</th><th>Agent</th><th>DMT</th><th>DMPC</th><th>DMPC globale</th><th>Statut</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}

// ---------- weekly KPI table (rows = KPIs, columns = semaines) ----------
function computeWeeklyKPITable(rows, mode, key){
  const buckets = {};
  rows.forEach(r=>{
    if(!r.debut) return;
    const wk = weekKey(r.debut);
    if(!buckets[wk]) buckets[wk] = {sortKey: weekSortKey(r.debut), rows:[]};
    buckets[wk].rows.push(r);
  });
  const weekLabels = Object.keys(buckets).sort((a,b)=>buckets[a].sortKey-buckets[b].sortKey);
  return weekLabels.map(wk=>{
    const wRows = buckets[wk].rows;
    const agg = aggregate(wRows, mode);
    const nbrAgent = new Set(wRows.filter(r=>r.agent).map(r=>r.agent)).size;
    return {label: wk, agg, nbrAgent};
  });
}

      {label:'DMT moyen',      get:w=>fmtHours(w.agg.avgDmt)},

      {label:'Tickets reçus',        get:w=>w.agg.totalRecu.toLocaleString('fr-FR')},

  }).join('');

  return `<table${tableId ? ` id="${tableId}"` : ''}><thead><tr><th>KPI</th>${headCells}</tr></thead><tbody>${bodyRows}</tbody></table>`;
}

// ---------- table export (CSV) ----------
function tableToCSV(table){
  const rows = Array.from(table.querySelectorAll('tr'));
  return rows.map(row=>{
    return Array.from(row.querySelectorAll('th,td')).map(cell=>{
      const text = cell.innerText.replace(/"/g,'""').trim();
      return `"${text}"`;
    }).join(',');
  }).join('\r\n');
}
function downloadTableCSV(tableId, filename){
  const table = document.getElementById(tableId);
  if(!table) return;
  const csv = '\uFEFF' + tableToCSV(table);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function destroyIfExists(id){
  if(CHARTS[id]){ CHARTS[id].destroy(); delete CHARTS[id]; }
}

// custom plugin: draws leader lines + "LABEL · XX%" text outside the ring, in the segment's color.
// Les libellés sont d'abord positionnés selon l'angle du secteur, puis on résout les chevauchements
// verticaux (côté gauche et côté droit séparément) en espaçant les libellés trop proches — la ligne
// de renvoi (leader line) forme alors un coude au lieu d'un simple trait droit.
const outerLabelsPlugin = {
  id: 'outerLabels',
  afterDraw(chart){
    const meta = chart.getDatasetMeta(0);
    if(!meta || !meta.data.length) return;
    const dataset = chart.data.datasets[0];
    const total = dataset.data.reduce((a,b)=>a+b,0);
    if(!total) return;
    const {ctx} = chart;
    ctx.save();
    ctx.font = "600 10.5px 'IBM Plex Sans', sans-serif";
    ctx.textBaseline = 'middle';

    // 1) géométrie brute de chaque libellé (position radiale selon l'angle du secteur)
    const items = meta.data.map((arc, i)=>{
      const angle = (arc.startAngle + arc.endAngle) / 2;
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const cx = arc.x, cy = arc.y;
      const outerR = arc.outerRadius;
      const p1 = {x: cx + cos*(outerR+2), y: cy + sin*(outerR+2)};
      const p2 = {x: cx + cos*(outerR+14), y: cy + sin*(outerR+14)};
      const isRight = cos >= 0;
      const p3x = p2.x + (isRight ? 12 : -12);
      const color = Array.isArray(dataset.backgroundColor) ? dataset.backgroundColor[i] : dataset.backgroundColor;
      const value = dataset.data[i];
      const pct = Math.round(value/total*100);
      const label = `${String(chart.data.labels[i]||'').toUpperCase()} · ${pct}%`;
      return {p1, p2, p3x, y:p2.y, isRight, color, label};
    });

    // 2) espacement vertical minimal entre libellés voisins, séparément à gauche et à droite
    const MIN_GAP = 14;
    ['left','right'].forEach(side=>{
      const group = items.filter(it => (side==='right') === it.isRight).sort((a,b)=>a.y-b.y);
      for(let k=1;k<group.length;k++){
        const prev = group[k-1], cur = group[k];
        if(cur.y - prev.y < MIN_GAP) cur.y = prev.y + MIN_GAP;
      }
      // si l'espacement a poussé le dernier libellé hors du canevas, on recale tout le groupe vers le haut
      if(group.length){
        const overflow = group[group.length-1].y - (chart.height - 8);
        if(overflow > 0) group.forEach(it => { it.y -= overflow; });
      }
    });

    // 3) dessin — coude vertical si le libellé a été déplacé par rapport à sa position d'origine
    items.forEach(({p1, p2, p3x, y, isRight, color, label})=>{
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p2.x, y);
      ctx.lineTo(p3x, y);
      ctx.stroke();

      ctx.fillStyle = '#5B6B80';
      ctx.textAlign = isRight ? 'left' : 'right';
      ctx.fillText(label, p3x + (isRight ? 5 : -5), y);
    });

    ctx.restore();
  }
};

function renderTypeChart(key, agg){
  const id = `chart-type-${key}`;
  destroyIfExists(id);
  const ctx = document.getElementById(id).getContext('2d');
  const labels = Object.keys(agg.byType);
  const data = Object.values(agg.byType);
  const palette = ['#132440','#FFC72C','#2FBFB5','#1E4FA3','#8592A6','#7FD9D2','#C3CAD6'];
  CHARTS[id] = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor: labels.map((_,i)=>palette[i%palette.length]), borderColor:'#FFFFFF', borderWidth:3 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      cutout:'66%',
      layout:{ padding:{top:22, bottom:22, left:70, right:70} },
      plugins:{ legend:{display:false}, tooltip:{enabled:true} }
    },
    plugins:[outerLabelsPlugin]
  });
}


// Tableau RPI OI : détail des Statuts regroupés selon leur Etat d'appels (Abouti / Non abouti), avec DMT moyen.
// Le taux est calculé sur le total général d'appels (Abouti + Non abouti).
function renderStatutByEtatTable(agg, tableId){
  const totalAbouti = Object.values(agg.statutByEtat.abouti).reduce((a,v)=>a+v.n,0);
  const totalNonAbouti = Object.values(agg.statutByEtat.nonAbouti).reduce((a,v)=>a+v.n,0);
  const grandTotal = totalAbouti + totalNonAbouti;
  if(!grandTotal) return `<div class="empty-state">Aucun statut à afficher.</div>`;

  const groupRows = (bucket, groupLabel, colorVar)=>{
    const entries = Object.entries(bucket).sort((a,b)=>b[1].n-a[1].n);
    const groupTotal = entries.reduce((a,[,v])=>a+v.n,0);
    const groupDmtSum = entries.reduce((a,[,v])=>a+v.dmtSum,0);
    const groupDmtN = entries.reduce((a,[,v])=>a+v.dmtN,0);
    const header = `<tr style="font-weight:600;color:var(--text);"><td colspan="2">${groupLabel}</td><td style="color:var(${colorVar});">${groupTotal.toLocaleString('fr-FR')}</td><td style="color:var(${colorVar});">${grandTotal?(groupTotal/grandTotal*100).toFixed(1):'0.0'}%</td><td style="color:var(${colorVar});">${fmtHours(groupDmtN?groupDmtSum/groupDmtN:null)}</td></tr>`;
    const detail = entries.map(([label,v])=>{
      const taux = grandTotal ? (v.n/grandTotal*100) : 0;
      const avgDmt = v.dmtN ? v.dmtSum/v.dmtN : null;
      return `<tr><td></td><td>${escapeHtml(label)}</td><td>${v.n.toLocaleString('fr-FR')}</td><td>${taux.toFixed(1)}%</td><td>${fmtHours(avgDmt)}</td></tr>`;
    }).join('');
    return header + detail;
  };

  const grandDmtSum = [...Object.values(agg.statutByEtat.abouti), ...Object.values(agg.statutByEtat.nonAbouti)].reduce((a,v)=>a+v.dmtSum,0);
  const grandDmtN = [...Object.values(agg.statutByEtat.abouti), ...Object.values(agg.statutByEtat.nonAbouti)].reduce((a,v)=>a+v.dmtN,0);

  return `
    <table${tableId ? ` id="${tableId}"` : ''}>
      <thead><tr><th></th><th>Statut</th><th>Nombre</th><th>Taux</th><th>DMT moyen</th></tr></thead>
      <tbody>
        ${groupRows(agg.statutByEtat.abouti, 'Abouti', '--green')}
        ${groupRows(agg.statutByEtat.nonAbouti, 'Non abouti', '--amber')}
        <tr style="font-weight:700;color:var(--text);border-top:2px solid var(--border);"><td colspan="2">Total</td><td>${grandTotal.toLocaleString('fr-FR')}</td><td>100.0%</td><td>${fmtHours(grandDmtN?grandDmtSum/grandDmtN:null)}</td></tr>
      </tbody>
    </table>`;
}

// ---------- RPI OI only : "Etat d'appels" (Abouti/Non Abouti) + "Repartition statuts" (barres) ----------
function renderAppelsChart(key, agg){
  const id = `chart-appels-${key}`;
  destroyIfExists(id);
  const ctx = document.getElementById(id).getContext('2d');
  const labels = ['Abouti', 'Non abouti'];
  const data = [agg.etatAppels.abouti, agg.etatAppels.nonAbouti];
  const colors = ['#1F9D6B', '#D6534A'];
  CHARTS[id] = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor: colors, borderColor:'#FFFFFF', borderWidth:3 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      cutout:'66%',
      layout:{ padding:{top:22, bottom:22, left:70, right:70} },
      plugins:{ legend:{display:false}, tooltip:{enabled:true} }
    },
    plugins:[outerLabelsPlugin]
  });
}

// ---------- load / init ----------
// ---------- diagnostic : affiche les en-têtes CSV réels + un exemple de ligne, pour vérifier le mapping des colonnes ----------
function showDetectedColumns(key, rawRows){
  const box = document.getElementById(`debug-${key}`);
  const target = document.getElementById(`debug-cols-${key}`);
  if(!box || !target) return;
  if(!rawRows || !rawRows.length){
    target.innerHTML = '(aucune ligne pour lister les colonnes)';
    box.style.display = 'block';
    return;
  }
  const headers = Object.keys(rawRows[0]);
  const sample = rawRows[0];
  const headersHtml = headers.map(h=>`<span style="display:inline-block;background:#E4E8EF;border-radius:3px;padding:1px 6px;margin:2px;">${escapeHtml(h)}</span>`).join('');
  const sampleHtml = headers.map(h=>`<div>${escapeHtml(h)} = <span style="color:var(--text);">${escapeHtml(String(sample[h]||''))}</span></div>`).join('');
  target.innerHTML = `<div style="margin-bottom:8px;"><strong>En-têtes (${headers.length})</strong> : ${headersHtml}</div><div><strong>Exemple (1ère ligne)</strong></div>${sampleHtml}`;
  box.style.display = 'block';
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function fetchCsvWithRetry(url, attempts){
  attempts = attempts || 3;
  let lastErr;
  // Paramètre anti-cache : RPI et VDC partagent le même document Google Sheets (même id 2PACX,
  // seul le gid change) ; on force une requête fraîche à chaque fois pour éviter qu'une réponse
  // mise en cache pour un gid ne soit confondue avec celle d'un autre.
  const bustedUrl = url + (url.includes('?') ? '&' : '?') + '_cb=' + Date.now();
  for(let i=0; i<attempts; i++){
    try{
      const res = await fetch(bustedUrl, {cache:'no-store'});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.text();
    }catch(err){
      lastErr = err;
      if(i < attempts - 1) await sleep(700 * (i + 1)); // backoff progressif : 0.7s, 1.4s...
    }
  }
  throw lastErr;
}

async function loadPage(key){
  const cfg = CONFIG[key];
  document.getElementById(`page-${key}`).innerHTML = pageShell(key, cfg);
  try{
    const csvText = await fetchCsvWithRetry(cfg.url, 3);
    const papaReady = await waitForPapaLib();
    if(!papaReady) throw new Error("La bibliothèque de lecture CSV n'a pas pu être chargée (réseau bloqué ?).");
    const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
    showDetectedColumns(key, parsed.data);
    const mode = detectMode(parsed.data);
    const rows = computeRows(parsed.data, mode, key);
    DATA[key] = rows;
    DATA_MODE[key] = mode;
    if(!rows.length){
      renderError(key, "Le fichier CSV a été récupéré mais ne contient aucune ligne exploitable.");
      return;
    }
    refreshFilterOptions();
    renderDashboard(key, applyFilters(rows), mode, rows.length);
  }catch(err){
    renderError(key, `Détail technique : ${err.message}`);
  }
}

function initTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`page-${btn.dataset.page}`).classList.add('active');
    });
  });
}

function tickClock(){
  const el = document.getElementById('clock');
  if(el) el.textContent = new Date().toLocaleString('fr-FR', {dateStyle:'medium', timeStyle:'medium'});
}

// ---------- filter bar (mois / semaine / date / agent / compte-zone — global, applied à toutes les pages) ----------
const FILTER_DEFS = [
  {name:'mois',         label:'Mois'},
  {name:'semaines',     label:'Semaines'},
  {name:'dates',        label:'Date'},
  {name:'agents',       label:'Agent'},
  {name:'zonesComptes', label:'Comptes / Zones'}
];

function refreshFilterOptions(){
  const allRows = Object.values(DATA).flat();
  const getDebut = r=>r.debut;
  const optionsByName = {
    mois:         buildSortedLabels(allRows, getDebut, monthKey, monthSortKey, false),
    semaines:     buildSortedLabels(allRows, getDebut, weekKey, weekSortKey, false),
    dates:        buildSortedLabels(allRows, getDebut, dateKey, dt=>dt.getTime(), false),
    agents:       Array.from(new Set(allRows.filter(r=>r.agent).map(r=>r.agent))).sort((a,b)=>a.localeCompare(b,'fr')),
    zonesComptes: Array.from(new Set(allRows.filter(r=>r.zoneCompte && r.zoneCompte!=='Non renseigné').map(r=>r.zoneCompte))).sort((a,b)=>a.localeCompare(b,'fr'))
  };
  FILTER_DEFS.forEach(f=> buildFilterPanel(f.name, optionsByName[f.name]));
}

function buildFilterPanel(name, options){
  const panel = document.getElementById(`panel-${name}`);
  if(!panel) return;
  const selected = FILTERS[name];
  // drop selections that are no longer valid options (data reloaded/changed)
  Array.from(selected).forEach(v=>{ if(!options.includes(v)) selected.delete(v); });
  panel.innerHTML = options.length
    ? options.map(opt=>{
        const checked = selected.has(opt) ? 'checked' : '';
        return `<label class="filter-item"><input type="checkbox" data-name="${name}" value="${escapeHtml(opt)}" ${checked}><span>${escapeHtml(opt)}</span></label>`;
      }).join('')
    : `<div class="filter-empty">Aucune option disponible</div>`;
  updateFilterCount(name);
}

function updateFilterCount(name){
  const n = FILTERS[name].size;
  const el = document.getElementById(`count-${name}`);
  if(el) el.textContent = n ? `(${n})` : '';
  const btn = document.getElementById(`btn-${name}`);
  if(btn) btn.classList.toggle('active', n>0);
}

function applyFiltersAndRerenderAll(){
  Object.keys(DATA).forEach(key=>{
    const rows = DATA[key];
    if(!rows || !rows.length) return;
    renderDashboard(key, applyFilters(rows), DATA_MODE[key], rows.length);
  });
  const resetBtn = document.getElementById('btn-reset');
  if(resetBtn) resetBtn.classList.toggle('active', activeFilterCount()>0);
}

function initFilterBar(){
  const bar = document.getElementById('filterbar');
  if(!bar) return;

  bar.addEventListener('change', e=>{
    const t = e.target;
    if(t.matches('input[type=checkbox][data-name]')){
      const name = t.dataset.name, value = t.value;
      if(t.checked) FILTERS[name].add(value); else FILTERS[name].delete(value);
      updateFilterCount(name);
      applyFiltersAndRerenderAll();
    }
  });

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const group = btn.closest('.filter-group');
      const wasOpen = group.classList.contains('open');
      document.querySelectorAll('.filter-group.open').forEach(g=>g.classList.remove('open'));
      if(!wasOpen) group.classList.add('open');
    });
  });
  document.querySelectorAll('.filter-panel').forEach(p=>{
    p.addEventListener('click', e=>e.stopPropagation());
  });
  document.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-group.open').forEach(g=>g.classList.remove('open'));
  });

  const resetBtn = document.getElementById('btn-reset');
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      FILTER_DEFS.forEach(f=>FILTERS[f.name].clear());
      refreshFilterOptions();
      applyFiltersAndRerenderAll();
    });
  }
}

initTabs();
initFilterBar();
tickClock();
setInterval(tickClock, 1000);
// Chargement séquentiel (et non en parallèle) : RPI et VDC pointent vers le MÊME document Google Sheets
// (même identifiant 2PACX, seul le gid change). Des requêtes simultanées vers ce même document publié
// provoquent des interférences côté Google (l'une des deux réponses peut revenir vide ou erronée).
// On charge donc les onglets un par un, chacun attendant la fin du précédent.
(async function loadAllPagesSequentially(){
  for(const key of Object.keys(CONFIG)){
    await loadPage(key);
  }
})();
</script>
